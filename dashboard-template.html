<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>NFL model card</title>
<style>
:root{--paper:#F4F3EE;--ink:#17202A;--ink2:#5B6572;--rule:#DCDAD2;--row:#FFFFFF;--chip:#ECEAE3;--green:#1E6B3A;--green-soft:#DCEBE0;--maroon:#8B2635;--maroon-soft:#F0DDE0;--amber:#A8780A;--amber-soft:#F7ECC9;--bar:#C9C6BC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14181D;--ink:#ECEAE3;--ink2:#A3AAB3;--rule:#2C333B;--row:#1C2128;--chip:#252B33;--green:#6CC38B;--green-soft:#1E3628;--maroon:#E48A98;--maroon-soft:#3B2228;--amber:#E6BC4F;--amber-soft:#3A3220;--bar:#3A424B;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#14181D;--ink:#ECEAE3;--ink2:#A3AAB3;--rule:#2C333B;--row:#1C2128;--chip:#252B33;--green:#6CC38B;--green-soft:#1E3628;--maroon:#E48A98;--maroon-soft:#3B2228;--amber:#E6BC4F;--amber-soft:#3A3220;--bar:#3A424B;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next",-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
header{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
header .sub{color:var(--ink2);font-size:12px;text-align:right;white-space:pre-line}
.weeks{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--paper);scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--rule)}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;border:1px solid var(--rule);background:var(--row);border-radius:16px;padding:5px 11px;font-size:14px;color:var(--ink2)}
.wk.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wk.done{border-style:dashed}
section{display:none}section.on{display:block}
.hero{padding:16px 16px 4px}
.hero .wkname{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
.hero .wkdates{color:var(--ink2);font-size:14px;margin-top:4px}
.panel{padding:12px 16px}
.panel h3{margin:14px 0 6px;font-size:16px;font-weight:600;text-wrap:balance}
.panel h3:first-child{margin-top:4px}
.panel h4{margin:14px 0 2px;font-size:13px;color:var(--ink2);font-weight:600}
.panel p{margin:6px 0;font-size:14px;max-width:65ch}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.ph h3{margin:0}
.muted{color:var(--ink2)}
.note{font-size:13px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
@media (max-width:360px){.pgrid{grid-template-columns:1fr}}
.pk{background:var(--row);border:1px solid var(--rule);border-radius:10px;padding:8px 10px 9px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"tm pc" "op fp" "cb cb" "fl fl";row-gap:3px;align-items:baseline}
.pk .fp{grid-area:fp;font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.pk .tm{grid-area:tm;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .pc{grid-area:pc;font-weight:600;font-size:15px}
.pk .op{grid-area:op;font-size:12px;color:var(--ink2)}
.pk .cb{grid-area:cb;height:4px;border-radius:2px;background:var(--chip);overflow:hidden;margin-top:3px}
.pk .cb i{display:block;height:100%;background:var(--green);border-radius:2px}
.pk.toss .cb i{background:var(--bar)}
.pk.done{opacity:.55}
.pk .fl{grid-area:fl;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.flag{font-size:11px;padding:1px 6px;border-radius:8px;background:var(--chip);color:var(--ink2)}
.flag.warn{background:var(--amber-soft);color:var(--amber)}
.flag.hit{background:var(--green-soft);color:var(--green)}
.flag.miss{background:var(--maroon-soft);color:var(--maroon)}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.lrow b{font-size:15px}
.lrow .why{grid-column:2;color:var(--ink2);font-size:13px}
.tier{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--chip);color:var(--ink2);min-width:56px;text-align:center}
.tier.strong{background:var(--green);color:var(--paper)}
.tier.mid{background:var(--green-soft);color:var(--green)}
.list-note{padding:8px 16px 4px;font-size:13px;color:var(--ink2)}
.game{background:var(--row);border-top:1px solid var(--rule);padding:12px 16px}
.game:last-child{border-bottom:1px solid var(--rule)}
.g1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.teams{font-weight:600;font-size:17px;line-height:1.25}
.teams .at{font-weight:400;color:var(--ink2);font-size:14px;padding:0 3px}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px;border:1px solid rgba(128,128,128,.35)}
.when{color:var(--ink2);font-size:12px;margin-top:2px}
.proj{text-align:right;font-size:12px;color:var(--ink2);white-space:nowrap}
.proj b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.lines{display:grid;grid-template-columns:52px 1fr 40px 1fr;align-items:center;gap:2px 6px;margin-top:10px;font-size:15px;cursor:pointer}
.lines .lb{font-size:12px;color:var(--ink2)}
.lines .hd{font-size:11px;color:var(--ink2)}
.lines .hd.r{text-align:right}
.lines .m{text-align:right;font-weight:600}
.lines .k{text-align:right;color:var(--ink2)}
.gap{height:20px;position:relative}
.gap i{position:absolute;top:8px;height:4px;border-radius:2px;background:var(--green)}
.gap i.neg{background:var(--maroon)}
.gap b{position:absolute;left:0;right:0;top:-2px;text-align:center;font-size:10px;font-weight:600;color:var(--ink2)}
.leanline{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;flex-wrap:wrap}
.leanline b{font-weight:600}
.leanline .why{color:var(--ink2);font-size:13px}
.tags{margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:2px 7px;border-radius:10px;margin:6px 6px 0 0;background:var(--chip);color:var(--ink2)}
.tag.qb{background:var(--amber-soft);color:var(--amber)}
.tag.warn{background:var(--maroon-soft);color:var(--maroon)}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.final{background:var(--ink);color:var(--paper)}
.tag.inj{background:var(--maroon-soft);color:var(--maroon)}
.injlist{font-size:13px;display:grid;gap:4px}
.injlist b{font-weight:600}
.detail{display:none;margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
.game.open .detail{display:block}
.detail h4{margin:14px 0 4px;font-size:13px;font-weight:600;color:var(--ink2)}
.detail h4:first-child{margin-top:2px}
.detail .sub4{font-size:12px;color:var(--ink2);margin:-2px 0 6px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 38% 72px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.fx .fl2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .tk{position:relative;height:10px;background:linear-gradient(var(--rule),var(--rule)) center/1px 100% no-repeat}
.fx .tk i{position:absolute;top:2px;height:6px;border-radius:3px;background:var(--green)}
.fx .tk i.neg{background:var(--maroon)}
.fx .fv{text-align:right;font-weight:600}
.fx.base{color:var(--ink2);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:2px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.kv span:nth-child(even){text-align:right}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.inrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.inrow label{font-size:12px;color:var(--ink2);display:block}
input[type=number]{width:100%;font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--amber-soft);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.verdict{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:14px}
.mlgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mlside{background:var(--paper);border-radius:8px;padding:8px 10px;display:grid;gap:4px;font-size:13px}
.mlside b{font-size:15px}
.mlside .fair{font-size:20px;font-weight:600}
.mlside label{font-size:12px;color:var(--ink2)}
.verdict.pos{background:var(--green-soft)}.verdict.neg{background:var(--maroon-soft)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink2);text-align:right;padding:4px 6px;border-bottom:1px solid var(--rule);vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--rule)}
tr.hi td{background:var(--green-soft)}
tr.grp td{color:var(--ink2);font-weight:600;padding-top:10px;border-bottom:none}
td .role,th .role{display:block;font-size:11px;color:var(--ink2);font-weight:400}
td.num{white-space:nowrap}
button{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid var(--ink);background:var(--row);color:var(--ink)}
button.small{font-size:13px;padding:5px 9px}
button:active{opacity:.7}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--rule)}
.stat span:nth-child(even){text-align:right}
.legs{margin:8px 0}
.leg{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.empty{padding:14px 0;color:var(--ink2);font-size:14px}
.divhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin:6px 0 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--row);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;border-radius:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--ink2)}
nav button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}.chips[hidden]{display:none}
.chip{font-size:13px;padding:5px 10px;border-radius:14px;border:1px solid var(--rule);background:var(--row);color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.vrow b{font-size:15px}.vrow .why{grid-column:2 / 4;color:var(--ink2);font-size:13px}
.evb{font-size:12px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--green-soft);color:var(--green);min-width:56px;text-align:center}
td.pos{color:var(--green);font-weight:600}
details.books{margin-top:8px}details.books summary{font-size:13px;color:var(--ink2);cursor:pointer;padding:4px 0}
.betrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.betrow b{font-size:15px}.betrow .note{margin-top:2px}
.betamt{text-align:right;font-weight:600;white-space:nowrap}
.betamt .x,.leg .x{border:none;background:none;color:var(--maroon);font-size:18px;padding:0 0 0 8px;vertical-align:-1px}
dialog{border:1px solid var(--rule);border-radius:14px;background:var(--row);color:var(--ink);padding:14px 16px 16px;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 8px;font-size:17px}
.fl{display:block;font-size:12px;color:var(--ink2);margin-top:10px}
select{width:100%;font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.seg{display:flex;gap:0;margin-top:10px;border:1px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:none;border-radius:0;background:var(--row);color:var(--ink);font-size:14px;padding:8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
input:disabled{opacity:.45}
textarea{width:100%;font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}
#imp-msg:empty{display:none}
button.primary{background:var(--ink);color:var(--paper)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:14px;padding:8px 14px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (min-width:700px){main,header,.weeks{max-width:640px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><h1>NFL model card</h1><div class="sub" id="subtitle"></div></header>
<div class="weeks" id="weeks"></div>
<main>
  <section id="tab-card" class="on">
    <div class="hero"><div class="wkname" id="wkname"></div><div class="wkdates" id="wkdates"></div></div>
    <div class="panel" id="leans"></div>
    <div class="list-note" id="cardnote"></div>
    <div id="games"></div>
  </section>
  <section id="tab-bets"><div class="panel" id="bets"></div></section>
  <section id="tab-parlay"><div class="panel" id="parlay"></div></section>
  <section id="tab-season"><div class="panel" id="season"></div></section>
  <section id="tab-record"><div class="panel" id="record"></div></section>
  <section id="tab-method"><div class="panel" id="method"></div></section>
</main>
<nav>
  <button data-tab="card" class="on">Card</button>
  <button data-tab="bets">Bets</button>
  <button data-tab="parlay">Parlay</button>
  <button data-tab="season">Season</button>
  <button data-tab="record">Record</button>
  <button data-tab="method">Method</button>
</nav>
<dialog id="betdlg" aria-labelledby="bf-title"><form id="betform" method="dialog" novalidate>
  <h3 id="bf-title">Log a bet</h3>
  <label class="fl" for="bf-game">Game</label><select id="bf-game"></select>
  <div class="seg" id="bf-kind" role="group" aria-label="Bet type"><button type="button" data-v="ml">Moneyline</button><button type="button" data-v="sp">Spread</button><button type="button" data-v="to">Total</button></div>
  <div class="seg" id="bf-side" role="group" aria-label="Side"></div>
  <div class="inrow"><div><label for="bf-line">Line</label><input id="bf-line" type="number" step="any"></div><div><label for="bf-price">Price</label><input id="bf-price" type="number" step="any"></div><div><label for="bf-stake">Stake, $</label><input id="bf-stake" type="number" step="1" min="0" inputmode="decimal"></div></div>
  <label class="fl" for="bf-book">Book</label><select id="bf-book"></select>
  <div class="verdict" id="bf-check" aria-live="polite"></div>
  <div class="btns"><button type="button" id="bf-cancel">Cancel</button><button type="submit" class="primary">Save bet</button></div>
</form></dialog>
<dialog id="impdlg" aria-labelledby="imp-title"><form id="impform" method="dialog" novalidate>
  <h3 id="imp-title">Import bets</h3>
  <p class="muted note" style="margin:0 0 8px">Paste the text from Copy as text in another copy of the card. Bets already here are skipped.</p>
  <textarea id="imp-text" rows="8" aria-label="Bets to import"></textarea>
  <div class="verdict" id="imp-msg" aria-live="polite"></div>
  <div class="btns"><button type="button" id="imp-cancel">Cancel</button><button type="submit" class="primary">Import</button></div>
</form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*__DATA__*/
const TEAM={ARI:['Cardinals','#97233F'],ATL:['Falcons','#A71930'],BAL:['Ravens','#241773'],BUF:['Bills','#00338D'],CAR:['Panthers','#0085CA'],CHI:['Bears','#0B162A'],CIN:['Bengals','#FB4F14'],CLE:['Browns','#311D00'],DAL:['Cowboys','#003594'],DEN:['Broncos','#FB4F14'],DET:['Lions','#0076B6'],GB:['Packers','#203731'],HOU:['Texans','#03202F'],IND:['Colts','#002C5F'],JAX:['Jaguars','#006778'],KC:['Chiefs','#E31837'],LA:['Rams','#003594'],LAC:['Chargers','#0080C6'],LV:['Raiders','#000000'],MIA:['Dolphins','#008E97'],MIN:['Vikings','#4F2683'],NE:['Patriots','#002244'],NO:['Saints','#D3BC8D'],NYG:['Giants','#0B2265'],NYJ:['Jets','#125740'],PHI:['Eagles','#004C54'],PIT:['Steelers','#FFB612'],SEA:['Seahawks','#002244'],SF:['49ers','#AA0000'],TB:['Buccaneers','#D50A0A'],TEN:['Titans','#0C2340'],WAS:['Commanders','#5A1414']};
const nm=t=>(TEAM[t]||[t])[0];
const sw=t=>'<i class="sw" style="background:'+((TEAM[t]||['','#888'])[1])+'"></i>';
// ---------- storage (best-effort; the page works without it) ----------
const store={get(k,d){try{const v=localStorage.getItem('nflcard.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nflcard.'+k,JSON.stringify(v))}catch(e){}}};
const S={week:DATA.current_week,lines:store.get('lines',{}),bankroll:store.get('bankroll',1000),legs:store.get('legs',[]),open:null,parlayPrice:store.get('pp',''),books:store.get('books',null),stake:store.get('stake',20)};
const RM=DATA.residuals.margin,RT=DATA.residuals.total,N=RM.length,BE=DATA.breakeven;
const CS=DATA.calib.spread,CT=DATA.calib.total;
const TEST=DATA.backtest.periods['2021-2025'];
const TOSS=0.55;
const fmt1=x=>(Math.round(x*10)/10).toFixed(1);
const pct=x=>(x*100).toFixed(1)+'%';
const pct0=x=>Math.round(x*100)+'%';
const signed=x=>(x>0?'+':'')+fmt1(x);
const signedPct=x=>(x>0?'+':'')+(x*100).toFixed(1)+'%';
const has=x=>x!==null&&x!==undefined;
const rate=wl=>wl[1]?wl[0]/wl[1]:0;
function impliedProb(am){am=Number(am);if(!am)return BE;return am<0?(-am)/(-am+100):100/(am+100)}
function decimal(am){am=Number(am);if(!am)return 1/BE;return am<0?1+100/(-am):1+am/100}
function amFromDec(d){return d>=2?'+'+Math.round((d-1)*100):''+Math.round(-100/(d-1))}
function coverProb(pred,line){let w=0,p=0;for(let i=0;i<N;i++){const m=Math.floor(pred+RM[i]+0.5);if(m>line)w++;else if(m===line)p++}return{win:w/N,push:p/N}}
function overProb(pred,line){let w=0,p=0;for(let i=0;i<RT.length;i++){const t=Math.floor(pred+RT[i]+0.5);if(t>line)w++;else if(t===line)p++}return{win:w/RT.length,push:p/RT.length}}
function noPush(pr){return pr.push>=1?0.5:pr.win/(1-pr.push)}
function calSpread(model,line){return 1/(1+Math.exp(-(CS[0]+CS[1]*(model-line))))}
function calTotal(model,line){return 1/(1+Math.exp(-(CT[0]+CT[1]*(model-line))))}
function jointProb(legs){let ok=0,tot=0;for(let i=0;i<N;i++){let all=true,push=false;for(const l of legs){const v=l.type==='spread'?Math.floor(l.pred+RM[i]+0.5):Math.floor(l.pred+RT[i]+0.5);if(v===l.line){push=true;continue}const win=(l.side==='home'||l.side==='over')?v>l.line:v<l.line;if(!win){all=false;break}}if(push)continue;tot++;if(all)ok++}return tot?ok/tot:0.5}
function kelly(p,am){const b=decimal(am)-1;const f=(p*b-(1-p))/b;return Math.max(0,Math.min(DATA.kelly.cap,f*DATA.kelly.frac))}

function renderParlay(){const el=document.getElementById('parlay');

function renderMethod(){const el=document.getElementById('method');const P=DATA.params;const M=DATA.model;el.innerHTML='<h3>How the numbers are made</h3>'+
  '<p>Every game gets about '+M.n_features+' inputs, each measured before kickoff: Elo ratings and a quarterback adjustment, efficiency (expected points per play for passing and rushing, first-down and explosive-play rates, completion percentage over expected), recent results at three time scales, turnovers and how much of a team\'s margin came from turnover and kicking luck, pass rush and protection, special teams and penalties, quarterback and coaching experience, and schedule, rest, travel and venue.</p>'+
  '<p>Three models read those inputs. Spread and total are regularized linear models fitted on '+M.fit_seasons[0]+'–'+M.fit_seasons[1]+'. The winner model is a regularized logistic model on the same inputs. The winner pick you see is the betting market\'s favorite, with its win probability after removing the book\'s cut: on held-out seasons that was the most accurate winner forecast available, ahead of the model and of the model combined with the line. The fair price is the moneyline that breaks even at that probability. Where no line is posted yet, the pick and fair price come from the model alone.</p>'+
  '<p><b>New this version.</b> Injuries: each player on the final injury report is weighted by his chance of missing the game and his share of snaps over the last four games, summed by position group. Play-by-play: success rate, early-down EPA, EPA in competitive game states, third-down and red-zone results, pass rate over expected, and special-teams EPA. Weather: game-time wind and temperature for outdoor games, from a forecast when the card is built. On held-out 2021–25 games these moved the model alone from 64.4% to 64.6% on winners and trimmed the average spread miss by 0.03 points and the total miss by 0.04. The line still misses by less.</p>'+
  '<p><b>Elo and quarterbacks.</b> Elo with margin of victory and regression to the mean each offseason, home field about '+fmt1(P.HFA/25)+' points. Every quarterback game gets a value from completions, yards, touchdowns, interceptions, sacks and rushing; when the listed starter differs from what a team has been getting, the difference moves the line at '+P.QB_MULT+' Elo points per value point.</p>'+
  '<p><b>Probabilities</b> for covering and going over come from the distribution of the model\'s own out-of-sample errors ('+DATA.residuals.margin.length+' games), which is what the charts in each game show, so the pile-ups at 3 and 7 are represented and push probability is real. <b>Calibration</b> then asks how often games with the same size of disagreement with the line actually covered; edges, stakes and the pick log use that calibrated number.</p>'+
  '<p><b>Prices at your books.</b> With an odds key, each build reads prices from up to 17 sportsbooks. Fair is Pinnacle\'s price, the usual benchmark because its margins are thin and it takes sharp bettors, with its cut removed; moneylines use the power method, which leaves longshots their historical win rates. A spread or total at another number is priced through the chance of every exact margin and total around the market\'s number, fitted on 2015–25 games: margins of 3 land about three times as often as a smooth curve says and 7 about twice, so a half point off 3 is worth about 18 cents and off 7 about 11. The Bets tab grades logged bets from final scores and prices each at the closing line the same way.</p>'+
  '<p><b>How it was tested.</b> Choices were made on 2002–20 only. 2021–25 was scored once at the end, with each season predicted by models refitted on the seasons before it. The Record tab shows those results, including the genetic search and its coin-flip control.</p>'+
  '<h3>What it is not</h3><p>It is not an edge against the line. The closing line predicts margins and totals better than the model in every period tested, and betting the model\'s side has landed near 50%. For picking winners, the line does most of the work; the model on its own is a strong team ranking, and the Record tab keeps score on both.</p>'+
  '<p class="muted">Built '+DATA.built+'. Model fitted '+M.built+'. Rating constants: '+Object.entries(P).map(([k,v])=>k+'='+v).join(', ')+'.</p>'}
